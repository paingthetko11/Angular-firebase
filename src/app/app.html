@if (notifications && notifications.length > 0) {
  <div class="grid grid-cols-12">
    <div class="col-span-12 table-card gap-3 p-4 w-full">
      <div class="space-y-4">
        @for (n of notifications; track n.id) {
          <div
            class="group relative overflow-hidden bg-white border border-slate-200 rounded-xl p-4 transition-all duration-200 hover:shadow-md hover:border-blue-200"
            [class.opacity-75]="n.read"
          >
            <div class="flex items-start gap-4">
              <!-- Content -->
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-start mb-1">
                  <h3 class="font-semibold text-slate-900 truncate pr-4">
                    <i class="pi pi-info-circle text-orange-600 text-xl"></i> {{ n.title }}
                  </h3>
                  <span class="font-semibold text-slate-500 whitespace-nowrap">
                    ID: {{ n.id }}
                  </span>
                </div>

                <p class="font-semibold text-slate-600 mb-3 line-clamp-2 leading-relaxed">
                  {{ n.body }}
                </p>

                <!-- Footer -->
                <div class="flex items-center gap-3">
                  <div
                    class="flex items-center text-[11px] font-medium text-orange-900 bg-orange-200 px-2 py-0.5 rounded-full"
                  >
                    <i class="pi pi-clock p-1"></i>
                    {{ n.date | date: 'shortTime' }}
                  </div>

                  <span class="text-[11px] text-slate-900 italic"> {{ getTimeAgo(n.date) }} </span>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <ng-template>
    <p>No notifications available.</p>
  </ng-template>
}
